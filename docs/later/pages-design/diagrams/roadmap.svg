<svg xmlns="http://www.w3.org/2000/svg" width="760" height="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 264" role="img" aria-label="Nothing starts before the start gate; v1 then takes 12 to 16 sessions" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" rx="12" fill="#FFFFFF"/><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1D">Nothing starts before the start gate; v1 then takes 12 to 16 sessions</text><text x="24" y="52" font-size="11.5" fill="#6B6862">Phases in order, not to scale</text><g><line x1="24" y1="184" x2="736" y2="184" stroke="#E6E3DC" stroke-width="1.25"></line></g><g><rect x="24" y="72" width="128" height="96" rx="8" fill="#EDECE8" stroke="#B9B5AB" stroke-width="1.25"></rect><text x="88" y="96" text-anchor="middle" font-weight="600" fill="#1F1E1D">Parked</text><text x="88" y="114" text-anchor="middle" font-size="11.5" fill="#6B6862">now to Feb 2027</text><text x="88" y="136" text-anchor="middle" font-size="11.5" fill="#1F1E1D">lab rebuilt,</text><text x="88" y="152" text-anchor="middle" font-size="11.5" fill="#1F1E1D">other work first</text></g><g><rect x="170" y="72" width="128" height="96" rx="8" fill="none" stroke="#B9B5AB" stroke-width="1.25"></rect><text x="234" y="96" text-anchor="middle" font-weight="600" fill="#1F1E1D">M0 Spike</text><text x="234" y="114" text-anchor="middle" font-size="11.5" fill="#6B6862">1 to 2 sessions</text><text x="234" y="136" text-anchor="middle" font-size="11.5" fill="#1F1E1D">eval 50 commands</text><text x="234" y="152" text-anchor="middle" font-size="11.5" fill="#1F1E1D">on 3 models</text></g><g><rect x="316" y="72" width="128" height="96" rx="8" fill="none" stroke="#B9B5AB" stroke-width="1.25"></rect><text x="380" y="96" text-anchor="middle" font-weight="600" fill="#1F1E1D">M1–M4 Build</text><text x="380" y="114" text-anchor="middle" font-size="11.5" fill="#6B6862">9 to 12 sessions</text><text x="380" y="136" text-anchor="middle" font-size="11.5" fill="#1F1E1D">core, pipeline,</text><text x="380" y="152" text-anchor="middle" font-size="11.5" fill="#1F1E1D">views, home</text></g><g><rect x="462" y="72" width="128" height="96" rx="8" fill="none" stroke="#B9B5AB" stroke-width="1.25"></rect><text x="526" y="96" text-anchor="middle" font-weight="600" fill="#1F1E1D">M5 Harden</text><text x="526" y="114" text-anchor="middle" font-size="11.5" fill="#6B6862">2 sessions</text><text x="526" y="136" text-anchor="middle" font-size="11.5" fill="#1F1E1D">Gatus, restore,</text><text x="526" y="152" text-anchor="middle" font-size="11.5" fill="#1F1E1D">runbook</text></g><g><rect x="608" y="72" width="128" height="96" rx="8" fill="none" stroke="#B9B5AB" stroke-width="1.25"></rect><text x="672" y="96" text-anchor="middle" font-weight="600" fill="#1F1E1D">Daily use</text><text x="672" y="114" text-anchor="middle" font-size="11.5" fill="#6B6862">4 weeks</text><text x="672" y="136" text-anchor="middle" font-size="11.5" fill="#1F1E1D">both users,</text><text x="672" y="152" text-anchor="middle" font-size="11.5" fill="#1F1E1D">then v1.1</text></g><g><path d="M161 175L170 184L161 193L152 184Z" fill="#2C6FD1" stroke="#2C6FD1" stroke-width="1"></path><text x="161" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1E1D">Start gate</text><text x="161" y="228" text-anchor="middle" font-size="11.5" fill="#6B6862">backups tested,</text><text x="161" y="244" text-anchor="middle" font-size="11.5" fill="#6B6862">priorities clear</text></g><g><path d="M307 175L316 184L307 193L298 184Z" fill="#B9B5AB" stroke="#B9B5AB" stroke-width="1"></path><text x="307" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1E1D">Model gate</text><text x="307" y="228" text-anchor="middle" font-size="11.5" fill="#6B6862">eval passes</text></g><g><path d="M599 175L608 184L599 193L590 184Z" fill="#B9B5AB" stroke="#B9B5AB" stroke-width="1"></path><text x="599" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1E1D">Production gate</text><text x="599" y="228" text-anchor="middle" font-size="11.5" fill="#6B6862">restore drill</text><text x="599" y="244" text-anchor="middle" font-size="11.5" fill="#6B6862">passes</text></g></svg>
