# Builds the pourOver image and publishes it to GHCR, after the tests pass.
#
#   push to main  -> ghcr.io/purrmonster/pourover:sha-<short commit>
#   tag vX.Y.Z    -> ghcr.io/purrmonster/pourover:X.Y.Z (and sha-<short commit>)
#
# No `latest`: purrbrews-containers pins a version and its digest, like every image of the
# fleet. The job summary prints that pin line for a tagged release.
#
# First publish only: the package starts private. Make it public once (package settings ->
# Change visibility), or every node would need a registry login to pull it.
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[dev]"
      - run: pytest -q
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $have"; exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/purrmonster/pourover
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=pourOver
            org.opencontainers.image.description=Text in meowGram, a well-filed task in Vikunja
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Pin line for purrbrews-containers
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              echo "Pin in stacks/grinder/pourover/docker-compose.yml:"
              echo '```'
              echo "image: ghcr.io/purrmonster/pourover:${GITHUB_REF_NAME#v}@${{ steps.build.outputs.digest }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
