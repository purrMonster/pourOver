[project]
name = "pourover"
version = "0.1.0"
description = "Plain text from chat in, well-filed Vikunja tasks out"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.5",
  "uvicorn==0.53.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pourover"]

[tool.setuptools.package-data]
pourover = ["prompts/*.md"]
